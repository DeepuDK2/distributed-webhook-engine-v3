version: '3.8'
services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: launchpad
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: webhook_engine
    ports:
      - "5432:5432"
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://launchpad:secret_password@postgres:5432/webhook_engine
    depends_on:
      - redis
      - postgres
